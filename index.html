<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
 
  <div class="calculator">
 
    <div class="brand">Python Calculator <span>· lambda functions</span></div>
 
    <!-- LCD-style screen -->
    <div class="screen">
      <div class="expression" id="expression">&nbsp;</div>
      <div class="display" id="display">0</div>
    </div>
 
    <!-- Key grid, laid out like a real calculator -->
    <div class="keys">
      <button class="key key-fn" data-action="clear">AC</button>
      <button class="key key-fn" data-action="backspace">⌫</button>
      <button class="key key-op" data-action="op" data-choice="5" data-symbol="^">^</button>
      <button class="key key-op" data-action="op" data-choice="4" data-symbol="÷">÷</button>
 
      <button class="key" data-action="digit" data-value="7">7</button>
      <button class="key" data-action="digit" data-value="8">8</button>
      <button class="key" data-action="digit" data-value="9">9</button>
      <button class="key key-op" data-action="op" data-choice="3" data-symbol="×">×</button>
 
      <button class="key" data-action="digit" data-value="4">4</button>
      <button class="key" data-action="digit" data-value="5">5</button>
      <button class="key" data-action="digit" data-value="6">6</button>
      <button class="key key-op" data-action="op" data-choice="2" data-symbol="−">−</button>
 
      <button class="key" data-action="digit" data-value="1">1</button>
      <button class="key" data-action="digit" data-value="2">2</button>
      <button class="key" data-action="digit" data-value="3">3</button>
      <button class="key key-op" data-action="op" data-choice="1" data-symbol="+">+</button>
 
      <button class="key key-wide" data-action="digit" data-value="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key key-equals" data-action="equals">=</button>
    </div>
 
    <div class="error" id="error"></div>
 
  </div>
 
<script>
  const expressionEl = document.getElementById('expression');
  const displayEl = document.getElementById('display');
  const errorEl = document.getElementById('error');
  const keys = document.querySelectorAll('.key');
 
  // ===== Calculator state =====
  // currentInput   -> the number currently being typed, as a string
  // firstOperand   -> the number stored once an operator is pressed
  // pendingChoice  -> which operation (1-5) is waiting to run
  // freshEntry     -> true right after an operator/equals, so the
  //                   next digit press starts a brand new number
  //                   instead of appending to the old one
  let currentInput = '0';
  let firstOperand = null;
  let pendingChoice = null;
  let freshEntry = true;
 
  const symbolFor = { 1: '+', 2: '−', 3: '×', 4: '÷', 5: '^' };
 
  function updateDisplay() {
    displayEl.textContent = currentInput;
  }
 
  function updateExpression() {
    if (firstOperand === null) {
      expressionEl.textContent = '\u00A0';
    } else {
      expressionEl.textContent = `${formatNumber(firstOperand)} ${symbolFor[pendingChoice]}`;
    }
  }
 
  function formatNumber(num) {
    const rounded = Math.round(num * 1e10) / 1e10;
    return rounded.toString();
  }
 
  function showError(message) {
    displayEl.textContent = 'Error';
    errorEl.textContent = message;
    errorEl.classList.add('show');
  }
 
  function clearError() {
    errorEl.textContent = '';
    errorEl.classList.remove('show');
  }
 
  async function runCalculation(choice, x, y) {
    const response = await fetch('/calculate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ choice: choice, x: x, y: y })
    });
    return response.json();
  }
 
  keys.forEach(key => {
    key.addEventListener('click', async () => {
      const action = key.dataset.action;
 
      key.classList.add('pressed');
      setTimeout(() => key.classList.remove('pressed'), 120);
 
      // ----- digit pressed -----
      if (action === 'digit') {
        clearError();
        const value = key.dataset.value;
        if (freshEntry) {
          currentInput = value === '0' ? '0' : value;
          freshEntry = false;
        } else {
          currentInput = currentInput === '0' ? value : currentInput + value;
        }
        updateDisplay();
        return;
      }
 
      // ----- decimal point pressed -----
      if (action === 'decimal') {
        clearError();
        if (freshEntry) {
          currentInput = '0.';
          freshEntry = false;
        } else if (!currentInput.includes('.')) {
          currentInput += '.';
        }
        updateDisplay();
        return;
      }
 
      // ----- AC pressed: reset everything -----
      if (action === 'clear') {
        currentInput = '0';
        firstOperand = null;
        pendingChoice = null;
        freshEntry = true;
        clearError();
        updateDisplay();
        updateExpression();
        return;
      }
 
      // ----- backspace pressed -----
      if (action === 'backspace') {
        if (!freshEntry) {
          currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : '0';
          updateDisplay();
        }
        return;
      }
 
      // ----- operator pressed (+ − × ÷ ^) -----
      if (action === 'op') {
        clearError();
        const choice = Number(key.dataset.choice);
 
        if (firstOperand !== null && !freshEntry) {
          // A number was already typed after a previous operator —
          // calculate that pending pair first (this is what lets you
          // chain: 5 + 3 then × 2, same as a real calculator)
          const result = await runCalculation(pendingChoice, firstOperand, Number(currentInput));
          if (!result.success) {
            showError(result.error);
            firstOperand = null;
            pendingChoice = null;
            freshEntry = true;
            return;
          }
          firstOperand = result.result;
        } else {
          firstOperand = Number(currentInput);
        }
 
        pendingChoice = choice;
        freshEntry = true;
        updateExpression();
        displayEl.textContent = formatNumber(firstOperand);
        return;
      }
 
      // ----- equals pressed -----
      if (action === 'equals') {
        clearError();
        if (firstOperand === null || pendingChoice === null) return;
 
        const secondOperand = Number(currentInput);
 
        try {
          const result = await runCalculation(pendingChoice, firstOperand, secondOperand);
          if (!result.success) {
            showError(result.error);
            firstOperand = null;
            pendingChoice = null;
            freshEntry = true;
            return;
          }
          expressionEl.textContent = `${formatNumber(firstOperand)} ${symbolFor[pendingChoice]} ${formatNumber(secondOperand)} =`;
          currentInput = formatNumber(result.result);
          displayEl.textContent = currentInput;
          firstOperand = null;
          pendingChoice = null;
          freshEntry = true;
        } catch (err) {
          showError('Could not reach the server. Is app_calculator.py running?');
        }
      }
    });
  });
 
  // Keyboard support, so typing works too, not just clicking
  document.addEventListener('keydown', (e) => {
    const map = { '+': '1', '-': '−', '*': '3', '/': '4', '^': '5' };
    if (e.key >= '0' && e.key <= '9') {
      document.querySelector(`.key[data-value="${e.key}"]`)?.click();
    } else if (e.key === '.') {
      document.querySelector('.key[data-action="decimal"]')?.click();
    } else if (e.key === 'Enter' || e.key === '=') {
      document.querySelector('.key[data-action="equals"]')?.click();
    } else if (e.key === 'Backspace') {
      document.querySelector('.key[data-action="backspace"]')?.click();
    } else if (e.key === 'Escape') {
      document.querySelector('.key[data-action="clear"]')?.click();
    } else if (e.key === '+') {
      document.querySelector('.key[data-choice="1"]')?.click();
    } else if (e.key === '-') {
      document.querySelector('.key[data-choice="2"]')?.click();
    } else if (e.key === '*') {
      document.querySelector('.key[data-choice="3"]')?.click();
    } else if (e.key === '/') {
      document.querySelector('.key[data-choice="4"]')?.click();
    } else if (e.key === '^') {
      document.querySelector('.key[data-choice="5"]')?.click();
    }
  });
</script>
 
</body>
</html>
